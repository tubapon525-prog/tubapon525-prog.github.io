name: 毎日の自動投稿

on:
  schedule:
    - cron: "0 10 * * *"   # 毎日 19:00（日本時間）
  workflow_dispatch:
    inputs:
      mode:
        description: "post=投稿する / check=ログイン確認だけ / dry_run=表示だけ"
        type: choice
        options: [check, dry_run, post]
        default: check
      account:
        description: "どのアカウント？"
        type: choice
        options: [all, lucky_and_haru, souta_to_fumi]
        default: all
      youtube_privacy:
        description: "YouTubeの公開設定（テストは private がおすすめ）"
        type: choice
        options: [private, unlisted, public]
        default: private

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 準備
        run: pip install requests

      - name: 投稿
        env:
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          ACCOUNT: ${{ github.event_name == 'schedule' && 'all' || inputs.account }}
          YT_PRIVACY: ${{ github.event_name == 'schedule' && 'public' || inputs.youtube_privacy }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          YT_REFRESH_LUCKY: ${{ secrets.YT_REFRESH_LUCKY }}
          YT_REFRESH_SOUTA: ${{ secrets.YT_REFRESH_SOUTA }}
          TT_REFRESH_LUCKY: ${{ secrets.TT_REFRESH_LUCKY }}
          TT_REFRESH_SOUTA: ${{ secrets.TT_REFRESH_SOUTA }}
        run: python scripts/post.py

      - name: 投稿済みの動画を片付ける
        if: always()
        run: |
          git config user.name "sns-auto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "片付けるものはありません"
          else
            git commit -m "投稿済み $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
